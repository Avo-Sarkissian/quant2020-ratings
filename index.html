<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>quant2020 ratings</title>
<style>
  /* No webfont link on purpose: this page is public, and a font CDN would make every
     visitor's browser call a third party. test_the_page_makes_no_external_request pins
     that. IBM Plex is used when the reader already has it; otherwise the system stack
     carries it and the palette does the identifying.
     Quant 2020 dark-terminal palette — the console's own tokens
     (console/frontend/src/index.css @theme), so the public feed reads as the
     same instrument rather than a separate product. Single-theme on purpose:
     the console commits to dark, and a light variant here would look foreign. */
  :root {
    --bg:#080B10; --bg-2:#0D131B; --bg-3:#10171F;
    --text:#E6ECF2; --body:#C2CDD8; --muted:#6E7B89; --label:#5E6B79;
    --orange:#E8743B; --green:#3FC396; --red:#F08079;
    --border:#1A232E; --row:#161E27;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--body); margin:0;
         padding:1.75rem clamp(1rem,3vw,2.25rem) 3rem;
         font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  .label { font:600 10px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase;
           color:var(--label); display:block; margin-bottom:.55rem; }
  h1 { font:600 1.15rem/1.2 var(--sans); color:var(--text); margin:0 0 .3rem;
       letter-spacing:-.01em; }
  .meta { color:var(--muted); font-family:var(--mono); font-size:11.5px;
          letter-spacing:.01em; margin-bottom:1.25rem; }
  .stale { background:#22160C; color:var(--orange); border:1px solid #3A2413;
           border-left:2px solid var(--orange); padding:.6rem .85rem;
           margin-bottom:1.1rem; font-weight:600; font-size:12.5px; }
  .bar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem; }
  input { padding:.42rem .65rem; border:1px solid var(--border); background:var(--bg-2);
          color:var(--text); width:18rem; font:12px var(--mono); border-radius:2px; }
  input::placeholder { color:var(--label); }
  input:focus { outline:none; border-color:var(--orange); }
  .hint { color:var(--label); font-size:11px; font-family:var(--mono); }
  .panel { border:1px solid var(--border); background:var(--bg-2);
           border-radius:2px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-family:var(--mono);
          font-size:12px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:.42rem .7rem; white-space:nowrap;
           border-bottom:1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { cursor:pointer; user-select:none; position:sticky; top:0; background:var(--bg-3);
       color:var(--label); font:600 10px/1.6 var(--sans); letter-spacing:.11em;
       text-transform:uppercase; border-bottom:1px solid var(--border); }
  th:hover { color:var(--orange); }
  tbody tr:hover { background:var(--row); }
  tbody td:first-child { color:var(--text); font-weight:500; }
  td.null { color:var(--label); }
  footer { color:var(--muted); margin-top:1.75rem; font-size:11.5px;
           border-top:1px solid var(--border); padding-top:.9rem; }
  footer strong { color:var(--red); }
  a { color:var(--orange); text-decoration:none; }
  a:hover { text-decoration:underline; }
  :focus-visible { outline:1px solid var(--orange); outline-offset:2px; }
</style>

<span class="label">Quant 2020 · research output</span>
<h1>quant2020 ratings</h1>
<div class="meta" id="meta">loading…</div>
<div class="stale" id="stale" hidden></div>
<div class="bar">
  <input id="q" placeholder="filter by ticker or sector" autocomplete="off">
  <span class="hint">click any column to sort</span>
</div>
<div class="panel">
  <table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
</div>
<footer>
  Research output of a paper-traded system. <strong>Not investment advice.</strong>
  Raw data: <a href="./data/latest.json">latest.json</a> ·
  <a href="./data/latest.csv">latest.csv</a> ·
  <a href="./data/index.json">history index</a>
</footer>

<script>
const COLS = [
  ["ticker","Ticker"], ["sector","Sector"], ["composite_rank","Rank"],
  ["composite_z","Composite z"], ["composite_pct","Pct"], ["ai_score","AI"],
  ["value_rank","Value rank"], ["growth_rank","Growth rank"],
];
let ROWS = [], sortKey = "composite_rank", sortAsc = true;

function weekdaysBetween(a, b) {
  let n = 0;
  for (const d = new Date(a); d < b; d.setUTCDate(d.getUTCDate() + 1)) {
    const day = d.getUTCDay();
    if (day !== 0 && day !== 6) n++;
  }
  return n;
}

function render() {
  const q = document.getElementById("q").value.trim().toUpperCase();
  const shown = ROWS.filter(r =>
    !q || (r.ticker || "").includes(q) || (r.sector || "").toUpperCase().includes(q));
  shown.sort((x, y) => {
    const a = x[sortKey], b = y[sortKey];
    if ((a === null || a === undefined) && (b === null || b === undefined)) return 0;
    if (a === null || a === undefined) return 1;   // nulls always last, both directions
    if (b === null || b === undefined) return -1;
    return (a < b ? -1 : a > b ? 1 : 0) * (sortAsc ? 1 : -1);
  });
  document.getElementById("rows").innerHTML = shown.map(r =>
    "<tr>" + COLS.map(([k]) => {
      const v = r[k];
      return v === null || v === undefined
        ? '<td class="null">–</td>' : "<td>" + v + "</td>";
    }).join("") + "</tr>").join("");
}

fetch("./data/latest.json").then(r => r.json()).then(doc => {
  ROWS = doc.ratings;
  const c = doc.counts;
  document.getElementById("meta").textContent =
    `as of ${doc.as_of} · ${c.tickers} tickers · ${c.with_composite} scored · ` +
    `${c.with_ai_score} AI-rated · generated ${doc.generated_at}`;

  // Staleness is the point, not a nicety: if the producing machine is down, latest.json
  // keeps serving the last good day. A reader must never be shown old numbers as new.
  const behind = weekdaysBetween(new Date(doc.as_of + "T00:00:00Z"), new Date());
  if (behind > 2) {
    const el = document.getElementById("stale");
    el.textContent =
      `This data is stale — the last run was ${doc.as_of}, ${behind} weekdays ago.`;
    el.hidden = false;
  }

  document.getElementById("head").innerHTML =
    COLS.map(([k, label]) => `<th data-k="${k}">${label}</th>`).join("");
  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortAsc = k === sortKey ? !sortAsc : true;
    sortKey = k;
    render();
  });
  document.getElementById("q").oninput = render;
  render();
}).catch(e => {
  document.getElementById("meta").textContent = "could not load ratings: " + e;
});
</script>
